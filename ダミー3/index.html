<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GitHub練習アプリ</title>
</head>
<body>
  <h1>GitHub練習アプリ</h1>

  <p>これはGitHubの画面操作を練習するためのダミーアプリです。</p>

  <button onclick="showMessage()">クリックしてみる</button>

  <p id="message"></p>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "ボタンがクリックされました！";
    }
  </script>
</body>
</html>
