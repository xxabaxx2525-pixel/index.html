<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心タイプ診断 | 捨てない片づけ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple: #534AB7;
  --purple-light: #EEEDFE;
  --purple-dark: #3C3489;
  --text: #1a1a2e;
  --text-sub: #666680;
  --border: rgba(83,74,183,0.15);
  --bg: #f8f8fc;
  --card: #ffffff;
  --radius: 14px;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem 4rem;
}

.container { max-width: 560px; margin: 0 auto; }

.header {
  text-align: center;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.6s ease both;
}

.header-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--purple);
  background: var(--purple-light);
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.header h1 { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
.header p { font-size: 14px; color: var(--text-sub); line-height: 1.7; }

.screen { display: none; }
.screen.active { display: block; animation: fadeUp 0.4s ease both; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.progress-wrap { margin-bottom: 1.5rem; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-label { font-size: 12px; font-weight: 500; color: var(--purple); }
.progress-pct { font-size: 12px; color: var(--text-sub); }
.progress-track { height: 5px; background: var(--purple-light); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--purple); border-radius: 3px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }

.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
  box-shadow: 0 2px 16px rgba(83,74,183,0.06);
}

.q-num { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--purple); margin-bottom: 8px; }
.q-text { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.6; margin-bottom: 1rem; }

.q-scene {
  font-size: 13px;
  color: var(--text-sub);
  background: var(--bg);
  border-left: 3px solid var(--purple);
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 1rem;
  line-height: 1.7;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.18s ease;
  background: var(--card);
}

.opt:hover { border-color: var(--purple); background: var(--purple-light); transform: translateX(2px); }
.opt.selected { border-color: var(--purple); background: var(--purple-light); }

.opt-letter {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid #ccc;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: var(--text-sub);
  flex-shrink: 0; margin-top: 1px;
  transition: all 0.18s;
}

.opt.selected .opt-letter { background: var(--purple); border-color: var(--purple); color: #fff; }
.opt-text { font-size: 14px; color: var(--text); line-height: 1.6; }

.nav { display: flex; gap: 8px; margin-top: 0.5rem; }

.btn {
  flex: 1; padding: 12px;
  border-radius: 10px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-sub);
  transition: all 0.18s;
  font-family: 'Noto Sans JP', sans-serif;
}

.btn:hover:not(:disabled) { background: var(--bg); color: var(--text); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--purple); color: #fff; border-color: var(--purple); }
.btn-primary:hover:not(:disabled) { background: var(--purple-dark); }

.result-badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; padding: 3px 12px; border-radius: 20px;
  background: var(--purple-light); color: var(--purple); margin-bottom: 10px;
}

.result-type { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.result-tagline { font-size: 14px; color: var(--text-sub); margin-bottom: 1.25rem; line-height: 1.7; }

.result-main {
  background: var(--card);
  border: 2px solid var(--purple);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 12px;
  box-shadow: 0 4px 20px rgba(83,74,183,0.1);
}

.inner-card { background: var(--bg); border-radius: 10px; padding: 1rem; margin-bottom: 8px; }
.inner-card:last-child { margin-bottom: 0; }

.section-title {
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--purple); margin-bottom: 6px;
  display: flex; align-items: center; gap: 5px;
}

.section-body { font-size: 13px; color: var(--text-sub); line-height: 1.8; }

.advice-item {
  font-size: 13px; color: var(--text-sub); line-height: 1.7;
  padding-left: 14px; position: relative; margin-bottom: 4px;
}
.advice-item::before { content: "・"; position: absolute; left: 0; color: var(--purple); }

.bar-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar-label { font-size: 11px; color: var(--text-sub); width: 84px; flex-shrink: 0; }
.bar-track { flex: 1; height: 5px; background: var(--purple-light); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--purple); border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
.bar-num { font-size: 11px; color: var(--text-sub); width: 16px; text-align: right; }

.sub-row { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
.sub-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.sub-tag { font-size: 12px; color: var(--text-sub); }

.btn-reset {
  width: 100%; margin-top: 12px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text-sub); font-size: 13px; padding: 10px;
  border-radius: 10px; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif; font-weight: 500;
  transition: all 0.18s;
}
.btn-reset:hover { background: var(--bg); color: var(--text); }

.footer { text-align: center; margin-top: 3rem; font-size: 12px; color: #bbb; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-badge">診断ワーク</div>
    <h1>安心タイプ診断</h1>
    <p>物を持つ時、あなたは何に安心を感じやすい？<br>9問に答えて、あなたの安心傾向を知りましょう。</p>
  </div>

  <div id="screen-q" class="screen active">
    <div class="progress-wrap">
      <div class="progress-top">
        <div class="progress-label" id="prog-label">Q1 / 9</div>
        <div class="progress-pct" id="prog-pct">11%</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:11%"></div></div>
    </div>
    <div class="q-card" id="q-card"></div>
    <div class="nav">
      <button class="btn" id="btn-back" onclick="go(-1)" disabled>戻る</button>
      <button class="btn btn-primary" id="btn-next" onclick="go(1)" disabled>次へ</button>
    </div>
  </div>

  <div id="screen-r" class="screen">
    <div class="result-badge">診断結果</div>
    <div class="result-type" id="r-name"></div>
    <div class="result-tagline" id="r-tagline"></div>
    <div class="result-main">
      <div style="margin-bottom:1rem" id="r-bars"></div>
      <div class="inner-card">
        <div class="section-title">▸ 安心のポイント</div>
        <div class="section-body" id="r-point"></div>
      </div>
      <div class="inner-card">
        <div class="section-title">▸ 気をつけたいこと</div>
        <div class="section-body" id="r-caution"></div>
      </div>
      <div class="inner-card">
        <div class="section-title">▸ おすすめの対策</div>
        <div id="r-advice"></div>
      </div>
    </div>
    <div id="r-sub"></div>
    <button class="btn-reset" onclick="reset()">もう一度診断する</button>
  </div>

  <div class="footer">© 捨てない片づけ</div>
</div>

<script>
const Qs = [
  {
    num:1, text:"ストックが残り少なくなった時、一番嫌なのは？", scene:null,
    opts:[
      {text:"買いに行く手間が増えること", scores:[0,0,2,0,0]},
      {text:"家族に不便をかけること", scores:[0,2,0,0,0]},
      {text:"いつものリズムが崩れること", scores:[2,0,0,0,0]},
      {text:"いざという時に困ること", scores:[0,0,0,0,2]}
    ]
  },
  {
    num:2, text:"収納スペースに余裕がなくなってきました。どれが一番気になりますか？", scene:null,
    opts:[
      {text:"ストックが足りなくなることが怖い", scores:[0,2,0,0,1]},
      {text:"空間が詰まってきたことが気になる", scores:[0,0,0,2,0]},
      {text:"管理できているかどうかが気になる", scores:[2,0,0,0,0]},
      {text:"非常時に困らないか考えてしまう", scores:[0,0,0,0,2]}
    ]
  },
  {
    num:3, text:"買い物に行けない日が3日続きそうです。事前にどう動きますか？",
    scene:"急な仕事や体調不良などで、しばらく買い物に行けないことが分かりました。",
    opts:[
      {text:"いつもより多めに買い込んでおく", scores:[0,2,0,0,1]},
      {text:"ストックがあるから特に何もしない", scores:[1,1,1,0,1]},
      {text:"足りなくなりそうなものだけリストアップして買う", scores:[2,0,0,0,0]},
      {text:"ネットで注文しておく", scores:[0,0,2,0,0]}
    ]
  },
  {
    num:4, text:"家の在庫管理について、一番近いのは？", scene:null,
    opts:[
      {text:"何がどこにどれだけあるか、だいたい把握している", scores:[2,0,0,1,0]},
      {text:"多めにあれば細かくは気にしない", scores:[0,2,0,0,0]},
      {text:"管理自体が面倒なのでなるべく考えたくない", scores:[0,0,2,0,0]},
      {text:"少なめにして、常に把握できる量にしている", scores:[0,0,0,2,0]}
    ]
  },
  {
    num:5, text:"日用品を買う時、一番重視するのは？", scene:null,
    opts:[
      {text:"切らさないこと", scores:[1,2,0,0,1]},
      {text:"考えなくて済むこと", scores:[0,0,2,0,0]},
      {text:"スペースを取らないこと", scores:[0,0,0,2,0]},
      {text:"いざという時にも困らないこと", scores:[0,0,0,0,2]}
    ]
  },
  {
    num:6, text:"面倒なことがある時、あなたはどうしますか？", scene:null,
    opts:[
      {text:"仕組みを作って、二度と考えなくて済むようにする", scores:[0,0,3,0,0], flag:"systematic"},
      {text:"とりあえず後回しにする", scores:[0,0,1,0,0]},
      {text:"誰かに頼むか、便利なサービスを使う", scores:[0,0,2,0,0]},
      {text:"少しずつその都度対処する", scores:[1,0,0,1,0]}
    ]
  },
  {
    num:7, text:"収納を見た時、どの状態が一番落ち着きますか？", scene:null,
    opts:[
      {text:"ぴったり必要な量だけある", scores:[2,0,0,1,0]},
      {text:"少し余裕がある", scores:[0,2,0,0,0]},
      {text:"すっきり少ない", scores:[0,0,0,2,0]},
      {text:"しっかり備えてある", scores:[0,0,0,0,2]}
    ]
  },
  {
    num:8, text:"家族や自分が体調を崩して1週間買い物に行けませんでした。",
    scene:"その時、家の中の状況はどうでしたか？",
    opts:[
      {text:"予備があったので乗り切れた、よかった", scores:[0,2,0,0,1]},
      {text:"少し困ったが何とかなった", scores:[1,0,0,0,0]},
      {text:"計算通りだった、特に問題なかった", scores:[2,0,1,0,0]},
      {text:"物が少ないぶん、かえってすっきり過ごせた", scores:[0,0,0,2,0]}
    ]
  },
  {
    num:9, text:"ストックについて、一番ストレスを感じるのは？", scene:null,
    opts:[
      {text:"切れそうになること", scores:[1,2,0,0,1]},
      {text:"管理や補充をいつも考え続けること", scores:[0,0,2,0,0]},
      {text:"物が増えて場所を取ること", scores:[0,0,0,2,0]},
      {text:"いざという時に足りないかもしれないこと", scores:[0,0,0,0,2]}
    ]
  }
];

const types = [
  {
    name:"回転安心タイプ", tagline:"多すぎず少なすぎず、ちょうどよく回っていることが安心",
    point:"一定量・期間で決める基準があると安定します。「1週間分」「1か月分」など自分なりの基準を持つことが鍵です。感覚よりも数字で決める方が向いています。",
    caution:"忙しい時や体調不良など、普段のリズムが崩れた時に在庫不足につながりやすくなります。",
    advice:["本当に切らすと困るものだけは、小さな予備を持つ","ネットスーパーや定期便など、直接買い物以外の手段を用意する","災害時に困りやすい物は、日常用とは別に少し備えておく"]
  },
  {
    name:"ゆとり安心タイプ", tagline:"少し余裕を持っておくことで安心できる",
    point:"「予備がある」と思えることが安心につながります。やみくもに増やすのではなく、自分が安心できるストックのラインを決めることが大切です。",
    caution:"不安から増やしすぎて、収納に収まらなくなったり何をどれだけ持てばいいか決められなくなることがあります。",
    advice:["5倍巻き・濃縮タイプなど省スペース商品に変える","「この棚まで」「このケースまで」と量の上限を決める","持つ理由を明確にして、計算して必要数を決める"]
  },
  {
    name:"手間なし安心タイプ", tagline:"しばらく気にしなくていい状態が安心",
    point:"物の量よりも「気にする手間・判断する回数」を減らすことが大事です。まとめ買い・定期購入・買う物の固定化と相性がよいタイプです。",
    caution:"全部を同じように管理しようとすると逆に管理量が増えます。消費が変動する物まで固定すると余ったり足りなくなることも。",
    advice:{
      systematic:["消費量を計算してから定期購入・まとめ買いの仕組みを作る","消費量が安定しているものだけ定期購入にする","長持ちする商品や交換頻度の少ない物を選ぶ"],
      default:["まず1品だけ消費量を計算してみる","定期便・サブスクを一つ試してみる","買う物リストを固定して判断回数を減らす"]
    }
  },
  {
    name:"すっきり安心タイプ", tagline:"物が少なく、空間と管理が軽いことが安心",
    point:"自分が管理できる上限を超えないことが鍵です。「安心のために持ったはずなのに逆にストレスになっていた」とならないよう、量より空間を優先する判断を大切に。",
    caution:"見た目のすっきりを優先しすぎると、急に足りなくなったり補充の回数が増えてかえって手間が増えることがあります。",
    advice:["表に出すものの量を絞り、予備は見えない場所に収納する","最低限の防災備蓄は別に用意する","定期便などでタイミングよく補充できる仕組みを作る"]
  },
  {
    name:"非常時安心タイプ", tagline:"いざという時にも止まらない状態が安心",
    point:"備えていること自体が安心につながります。「たくさん持つこと」ではなく、日常分と備えを分けて設計することが大切です。",
    caution:"不安のまま何でも増やすと収納も管理も苦しくなります。何をどれだけ持てばいいか分からず増やし続けてしまうことも。",
    advice:["「何日分持つか」など基準を決める","日常用と非常用を分けて管理する","ローリングストックで日常使いしながら非常時にも対応できる形にする"]
  }
];

const typeNames = ["回転","ゆとり","手間なし","すっきり","非常時"];
let cur = 0;
let answers = new Array(Qs.length).fill(null);

function renderQ() {
  const q = Qs[cur];
  const pct = Math.round(((cur+1)/Qs.length)*100);
  document.getElementById("prog-label").textContent = `Q${cur+1} / ${Qs.length}`;
  document.getElementById("prog-pct").textContent = pct + "%";
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("btn-back").disabled = cur === 0;
  document.getElementById("btn-next").disabled = answers[cur] === null;
  document.getElementById("btn-next").textContent = cur === Qs.length-1 ? "結果を見る ▸" : "次へ ▸";

  const letters = ["A","B","C","D"];
  let html = `<div class="q-num">QUESTION ${q.num}</div><div class="q-text">${q.text}</div>`;
  if (q.scene) html += `<div class="q-scene">${q.scene}</div>`;
  q.opts.forEach((o,i) => {
    const sel = answers[cur] === i ? " selected" : "";
    html += `<div class="opt${sel}" onclick="select(${i})"><div class="opt-letter">${letters[i]}</div><div class="opt-text">${o.text}</div></div>`;
  });
  document.getElementById("q-card").innerHTML = html;
}

function select(i) {
  answers[cur] = i;
  renderQ();
}

function go(dir) {
  if (dir === 1 && answers[cur] === null) return;
  if (dir === 1 && cur === Qs.length-1) { showResult(); return; }
  cur = Math.max(0, Math.min(Qs.length-1, cur+dir));
  renderQ();
}

function showResult() {
  const scores = [0,0,0,0,0];
  let isSystematic = false;
  Qs.forEach((q,qi) => {
    const ai = answers[qi];
    if (ai === null) return;
    const opt = q.opts[ai];
    opt.scores.forEach((s,si) => scores[si] += s);
    if (opt.flag === "systematic") isSystematic = true;
  });

  const max = Math.max(...scores);
  const mainIdx = scores.indexOf(max);
  const main = types[mainIdx];
  const subs = scores.map((s,i)=>({s,i})).filter(x=>x.i!==mainIdx&&x.s>0).sort((a,b)=>b.s-a.s).slice(0,2);

  document.getElementById("r-name").textContent = main.name;
  document.getElementById("r-tagline").textContent = main.tagline;
  document.getElementById("r-point").textContent = main.point;
  document.getElementById("r-caution").textContent = main.caution;

  const advList = mainIdx === 2 ? (isSystematic ? main.advice.systematic : main.advice.default) : main.advice;
  document.getElementById("r-advice").innerHTML = advList.map(a=>`<div class="advice-item">${a}</div>`).join("");

  document.getElementById("r-bars").innerHTML = `<div style="margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--purple)">▸ スコア分布</div>` +
    scores.map((s,i)=>`
    <div class="bar-wrap">
      <div class="bar-label">${typeNames[i]}安心</div>
      <div class="bar-track"><div class="bar-fill" style="width:${max>0?Math.round((s/max)*100):0}%"></div></div>
      <div class="bar-num">${s}</div>
    </div>`).join("");

  const subEl = document.getElementById("r-sub");
  if (subs.length > 0) {
    subEl.innerHTML = `<p style="font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--purple);margin-bottom:8px">▸ サブタイプ</p>` +
      subs.map(x=>`<div class="sub-row"><div class="sub-name">${types[x.i].name}</div><div class="sub-tag">${types[x.i].tagline}</div></div>`).join("");
  } else { subEl.innerHTML = ""; }

  document.getElementById("screen-q").classList.remove("active");
  document.getElementById("screen-r").classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}

function reset() {
  cur = 0;
  answers = new Array(Qs.length).fill(null);
  document.getElementById("screen-r").classList.remove("active");
  document.getElementById("screen-q").classList.add("active");
  renderQ();
  window.scrollTo({top:0, behavior:"smooth"});
}

renderQ();
</script>
</body>
</html>
